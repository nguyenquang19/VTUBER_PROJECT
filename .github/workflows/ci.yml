name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: v2.0

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2.0/requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run offline unit and integration tests
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pytest tests -m "not llm and not slow" --tb=short -q --junitxml=test-results/pytest.xml

      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: v2.0/test-results/pytest.xml
          if-no-files-found: warn
