# Autonomy Engine v2 config (spec AUTONOMY_ENGINE_REDESIGN.md)
# Đây là engine "tự nói" — thay hardcode silence>60s bằng urge accumulator
# probabilistic + category-based, có biến thiên, không lộ pattern hằng số.

autonomy:
  # Tick loop — bao lâu cập nhật urge score 1 lần
  tick_seconds: 5.0

  # ── UrgeAccumulator ──
  urge:
    # Rise curve: base_rise per tick theo silence (giây từ external activity gần nhất)
    # Chậm khi mới im, nhanh dần. Đơn vị: điểm urge/tick.
    # Tuning: silence 30s → base_rise ~2, silence 120s → base_rise ~8
    rise_base: 0.5              # nhân với silence để tính base_rise (linear đơn giản MVP)
    rise_max_per_tick: 12.0     # cap để không explode
    urge_floor: 30.0            # < floor → chắc chắn chưa nói
    urge_noise_std: 3.0         # noise Gaussian mỗi tick (biến thiên bắt buộc)
    decay_after_speak: 8.0      # trong self_cooldown, urge giảm mỗi tick
    self_cooldown_seconds: 45   # sau tự nói, cooldown riêng (khác last_speak chung)

    # Mood modifier (dùng mood v1 self-report, khi Phase 7.5 xong đổi nguồn)
    bon_chon_weight: 0.6        # bon_chon càng cao urge tăng nhanh
    buon_dampen: 0.4            # buon cao → urge chậm lại
    nguong_dampen: 0.5          # nguong cao → ngại nói → chậm

    # Probability curve tại should_speak_now: sigmoid quanh (urge_floor + 20)
    # Đơn giản: p = clamp((urge - urge_floor) / 40, 0, 0.85)
    # → urge 30 = 0%, urge 50 = 50%, urge 70+ = ~85% mỗi tick
    prob_scale: 40.0
    prob_max: 0.85

  # ── CategorySelector ──
  # Trọng số + cooldown riêng mỗi category. Không chọn lại category vừa dùng trong
  # no_repeat_window lần gần nhất.
  no_repeat_window: 2

  categories:
    complain_silence:
      weight: 1.0
      cooldown_seconds: 300
      mood_boost: { bon_chon: 1.5 }
      prompt_hint: "Càm ràm nhẹ về việc chat im re, kiểu trách móc đùa, không khẩn cầu."

    share_thought:
      weight: 1.2
      cooldown_seconds: 240
      mood_boost: { vui: 1.2 }
      prompt_hint: "Kể 1 chuyện vặt hoặc suy nghĩ bất chợt, không liên quan chat."

    ask_chat:
      weight: 1.0
      cooldown_seconds: 200
      mood_boost: {}
      prompt_hint: "Đặt 1 câu hỏi ngắn cho chat, kiểu tò mò."

    call_operator:
      weight: 0.6
      cooldown_seconds: 400
      mood_boost: { bon_chon: 1.3, buon: 1.1 }
      prompt_hint: "Gọi ông kiểu ngang/trêu, KHÔNG khẩn cầu thật (persona Phần C)."

    follow_up_topic:
      weight: 0.8
      cooldown_seconds: 350
      mood_boost: {}
      prompt_hint: "Quay lại 1 chủ đề vừa nhắc trước đó trong session, thêm ý mới."

    environment_reaction:
      weight: 1.0
      cooldown_seconds: 180
      mood_boost: {vui: 1.1, bon_chon: 1.1}
      prompt_hint: "Bình luận đúng một quan sát môi trường đã được ghi nhận, không suy diễn thêm."

    roast_chat:
      weight: 0.9
      cooldown_seconds: 300
      mood_boost: { buc: 1.2, bon_chon: 1.1 }
      prompt_hint: |
        Chủ động cà khịa 1 chat gần đây — KHÔNG phải trả lời, mà MỞ LỜI tấn công/mỉa
        mai chuyện họ nói. Cà khịa thẳng, đúng persona ngang tính (Phần A), không
        rude quá đà (persona Phần C ranh giới #4 người tổn thương thật vẫn giữ).
        Không hedge — chọn góc chê 1 phía.
