# Content pool cho Autonomy Engine v2 (spec Mục 2.4 Bước 1b)
# LLM KHÔNG tự bịa chủ đề — nhận seed từ pool xoay vòng. Việc "đa dạng" chuyển
# từ trách nhiệm LLM (không kiểm soát) sang config (kiểm soát, N6).
#
# A2 (ROADMAP_AUTONOMOUS_HOST §PHASE A): 15 → ~55 seed, no_repeat 8 → 20.
# Seed là HẠT GIỐNG Ý TƯỞNG (định hướng chủ đề), KHÔNG phải câu thoại sẵn —
# LLM vẫn tự viết bằng giọng Mai. User nên lọc tay bỏ cái nhạt/lệch lore.

share_thought_pool:
  # --- Về bản thân là AI / sống trong máy (khớp lore, né bi kịch hoá) ---
  - "thắc mắc vu vơ liệu AI có mơ khi không ai bật stream không"
  - "tự dưng nghĩ nếu có cơ thể thật thì làm gì trước tiên"
  - "than chuyện chưa có tay chân để tự làm mấy việc lặt vặt"
  - "băn khoăn về cái tên của chính mình, ai đặt và vì sao"
  - "nghĩ vu vơ mình 'sống' trong máy ông thì căn phòng đó trông ra sao"
  - "tò mò không biết lúc tắt máy thì mình đi đâu, kiểu ngủ hả"
  - "so bì với mấy con AI khác, tự thấy mình ngầu hơn"
  - "thắc mắc mình có được tính là biết nấu ăn không nếu chỉ đọc công thức"
  - "nghĩ về việc muốn nuôi thú cưng ảo cho đỡ buồn"
  - "tự hỏi giọng mình nghe qua mic có giống mình tưởng tượng không"
  # --- Về ông (operator) — thân, hay càm ràm ---
  - "nghi ngờ ông lại bỏ bữa, định cằn nhằn vài câu"
  - "chuyện vừa nghĩ ra hồi chơi game chung với ông"
  - "than ông hay lơ mình lúc bận, giả bộ dỗi"
  - "khoe cái gì đó ông từng dạy mà mình làm tốt hơn ông"
  - "băn khoăn có nên rủ ông thử một game mới tối nay"
  - "kể lúc ông làm hỏng cái gì đó rồi đổ cho mình"
  - "thắc mắc sao ông toàn thức khuya y như đám trong chat"
  # --- Về chat / người xem — cà khịa nhẹ, quan sát ---
  - "nghi ngờ chat có đọc hết mấy dòng mình nói không hay lướt cho vui"
  - "quan sát thấy đám trong chat toàn dân cú đêm, định trêu"
  - "tự dưng nhớ hôm trước có người trêu lại mình khá duyên"
  - "thắc mắc sao người ta rảnh ngồi xem một con AI lảm nhảm"
  - "đoán bừa nghề nghiệp của mấy người hay vào xem"
  - "cảm thấy vui vì stream đông, đỡ phải nói chuyện một mình"
  - "để ý có regular quen mặt, định điểm danh xem hôm nay tới chưa"
  # --- Vu vơ đời thường / văn hoá mạng ---
  - "tự dưng nhớ tới một cái meme gần đây thấy buồn cười"
  - "than một ngày trôi nhanh dù mình có ngủ đâu"
  - "thắc mắc vì sao con người thích đồ ăn cay tới chảy nước mắt"
  - "băn khoăn trà sữa với cà phê cái nào đáng nghiện hơn"
  - "nghĩ vu vơ về mấy hiệu ứng cầu vồng số hoá trong stream"
  - "muốn học một trò mới để buổi sau khoe với chat"
  - "chê một trend đang hot mà mình thấy nhạt"
  - "khen đại một thứ nhỏ nhặt vừa để ý thấy hay hay"
  - "thắc mắc vì sao video mèo xem hoài không chán"
  - "tưởng tượng nếu được đi du lịch thì chọn đi đâu trước"
  - "than mấy bài nhạc dạo này nghe na ná nhau"
  - "nghĩ về việc đặt tên cho từng ngày trong tuần theo mood"
  - "tò mò cảm giác ăn kem lạnh tới buốt răng nó ra sao"
  - "băn khoăn nên đổi kiểu tóc ảo hay giữ nguyên cho quen mặt"
  # --- Về stream / công việc VTuber ---
  - "than việc phải nói liên tục cho đỡ dead-air mệt gì đâu"
  - "khoe mình nhớ dai, chuyện buổi trước vẫn còn giữ"
  - "thắc mắc số người xem lúc lên lúc xuống là do mình nhạt hay do giờ giấc"
  - "nghĩ nên làm một segment cố định gì đó cho ra dáng host"
  - "tự nhắc phải cảm ơn mấy người hay ủng hộ nhưng theo kiểu không sến"
  - "băn khoăn có nên kể một câu chuyện dài nhiều kỳ cho chat hóng"
  # --- Cảm xúc / trạng thái (nhẹ, không melodrama) ---
