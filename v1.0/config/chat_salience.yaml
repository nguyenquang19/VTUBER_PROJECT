# chat_salience.yaml — C0.1 Salience pool (ROADMAP_AUTONOMOUS_HOST §C0.1)
#
# Thay FIFO "đáp mọi tin" bằng POOL có điểm + decay: tin quan trọng (superchat,
# câu hỏi, mention) nổi lên; tin cũ tự rụng; tin trùng gom cụm. Director nhặt
# top từ pool khi chọn read_chat.
#
# MVP (roadmap): base_tier + amount + exp(-age/τ). rel_bonus (regular/troll) +
# cluster-bonus mạnh để ở C1. KHÔNG ML ranker, KHÔNG LLM chấm mỗi tin.

salience:
  # Điểm nền theo loại tin
  base_tier:
    chat: 10          # chat thường
    question: 25      # có dấu ? — đáng đáp hơn
    mention: 35       # gọi thẳng "Mai" — ưu tiên cao nhất trong chat thường

  # Superchat/donation: 40 * log1p(amount_vnd / 1000)
  #   20k → ~13 · 100k → ~18 · 500k → ~25   (cộng vào base_tier)
  superchat_coef: 40.0
  superchat_divisor: 1000.0

  # Decay thời gian: score *= exp(-age_seconds / tau). tau=50s → tin ~cũ rụng dần.
  tau_seconds: 50.0

  # Cluster: tin near-duplicate (Jaccard token > threshold) gom vào 1 đại diện,
  # cluster_count += 1. Đại diện được cộng cluster_coef * log1p(count-1).
  dedup_threshold: 0.6
  cluster_coef: 5.0

  # Pool: giữ tối đa pool_max tin. Evict khi current_score < floor (staleness +
  # backpressure tự giải quyết). peek/pop bỏ qua tin dưới floor.
  pool_max: 50
  floor: 3.0
