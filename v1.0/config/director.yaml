# director.yaml — C0.3 Director loop (docs/03_COMPONENT_REFERENCE.md §C0.4)
#
# Đạo diễn: biến reactive (đáp mọi tin) → host (biết NÊN làm gì). State machine
# segment + bảng action + vài rule if/else. KHÔNG utility-scoring nhiều chiều,
# KHÔNG gọi LLM mỗi tick — chỉ chốt action rồi caller mới sinh thoại.

director:
  tick_seconds: 1.5               # nhịp Director hỏi decide() — TÁCH khỏi autonomy (5s)
  dead_air_seconds: 28            # im tối thiểu trước khi self-talk được cân nhắc (20→28: nhường chat)
  self_talk_cooldown_seconds: 45  # khoảng nghỉ toàn cục giữa 2 self-talk đã delivery
  max_consecutive_read_chat: 3    # đáp chat liên tiếp quá N → ép xen chủ động
  max_refs_per_turn: 3            # read_chat gộp tối đa 3 tin (chống "máy đọc chat")
  backlog_summary_threshold: 12   # pool > N tin + điểm top thấp → 1 câu tổng, không đáp lẻ
  summary_score_ceiling: 15.0     # top score dưới ngưỡng này (khi backlog cao) → summary
  min_actionable_score: 12.0      # dưới ngưỡng: giữ để cluster/decay nhưng không mở turn riêng (15→12: trả nhiều chat hơn)

  room_reaction:
    cooldown_seconds: 120         # không nhắc lại nhịp phòng quá một lần mỗi 2 phút
    retry_defer_seconds: 60       # hoãn thử lại nếu candidate sửa vẫn trùng
    recent_window: 16             # bounded output phòng chat đã delivery để so trùng
    similarity_threshold: 0.72    # token Jaccard; cao hơn = chỉ chặn câu giống hơn
    max_regenerations: 1          # tối đa một lần sửa candidate trùng

  speech_dedup:
    recent_window: 64             # bắt lặp xa giữa các action trong cùng mạch live
    similarity_threshold: 0.72    # bắt cả câu đảo thứ tự nhưng giữ câu khác ý cùng chủ đề
    max_regenerations: 1          # một correction attempt; vẫn trùng thì suppress

  speech_style:
    recent_window: 12             # delivery gần nhất dùng tính ngân sách văn phong
    formula_openers: ["mà", "trời ơi", "ủa", "ơ kìa"]
    max_formula_openers: 2        # tối đa 2/12 lượt dùng nhóm opener công thức
    max_same_opener: 1            # không lặp cùng opener trong cửa sổ
    max_questions: 2              # invite bypass; các lượt khác dùng ngân sách chung
    question_endings: ["nhỉ", "hả", "à", "ư", "không", "chưa", "sao", "gì", "nào"]
    max_sentences: 2              # shape bound chống nhiều đoạn/lặp nội bộ
    max_words: 65                 # không dùng làm speech-rate gate
    max_regenerations: 1          # style-bad sửa một lần; vẫn lỗi thì fail-open

  transactions:
    max_recent: 256               # bounded idempotency/trace cache

  decision_records:
    max_recent: 256               # bounded operator trace cache
    max_evidence_refs: 8          # chỉ ID grounded, không raw chat/viewer identity
    max_label_chars: 120
    hard_rejection_reasons:
      - safety_hold
      - donation_evidence_missing
      - follow_up_evidence_missing
      - goal_action_not_allowed
      - thread_missing
      - unsupported_goal_kind

  # Segment: mỗi phần {goal, duration_seconds, allowed_actions}. Duration là
  # kế hoạch — Director tự chuyển khi hết giờ (Mai thông báo). Số thật tune sau.
  arbiter:
    ask_follow_up_before_expiry_s: 20
    donation_sla_seconds: 5
    context:
      max_chars: 900
      field_max_chars: 240

  segments:
    - name: opening
      goal: "chào mở màn, bắt nhịp"
      duration_seconds: 120
      allowed_actions: [self_talk, read_chat, ack_donation, continue_thread, ask_follow_up, share_goal_progress, transition]
    - name: main
      goal: "nội dung chính"
      duration_seconds: 1800
      allowed_actions: [read_chat, self_talk, follow_up, ack_donation, continue_thread, ask_follow_up, share_goal_progress, transition]
    - name: chat
      goal: "tương tác chat tập trung"
      duration_seconds: 600
      allowed_actions: [read_chat, ack_donation, self_talk, continue_thread, ask_follow_up, share_goal_progress, transition]
    - name: closing
      goal: "kết thúc, chào tạm biệt"
      duration_seconds: 120
      allowed_actions: [self_talk, ack_donation, continue_thread, ask_follow_up, share_goal_progress, transition]
