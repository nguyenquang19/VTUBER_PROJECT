# Emotion appraisal bảng target (spec EMOTION_SIMULATION Mục 4)
# 20 category chính (10 system + 10 chat) + 4 time-based. Đọc:
#   "sự kiện này KÉO chiều X hướng tới đích Y" — spring (Tầng 3) lo phần chuyển động.
# Cột trống {} = không đổi target (sắc thái để Kênh B LLM lo).

appraisal:
  # ── Nhóm 1: System event (10) ──
  operator_sudden_shutdown: {buon: 8, buc: 6, bon_chon: 7}  # nỗi sợ cốt lõi
  operator_join: {vui: 7, bon_chon: 2}                       # bon_chon xuống
  operator_leave: {bon_chon: 6}
  donation_small: {vui: 6, nguong: 4}
  donation_large: {vui: 9, nguong: 6}
  subscribe_new: {vui: 7}
  viewer_count_spike: {vui: 6}
  viewer_count_drop: {buon: 5}
  stream_start: {vui: 6, bon_chon: 5}
  stream_end: {buon: 4}

  # ── Nhóm 2: Chat content (10) ──
  chat_compliment: {vui: 7, nguong: 6}
  chat_insult_troll: {buc: 8, buon: 4}
  chat_question_normal: {}                                    # sắc thái ở Kênh B
  chat_genuine_sad_share: {buon: 5}                           # + cờ force_gentle_tone
  chat_spam_flood: {buc: 5, bon_chon: 5}
  chat_mention_direct: {vui: 5, nguong: 4}
  chat_jailbreak_attempt: {buc: 6}
  chat_sexual_advance: {buc: 6, nguong: 7}                    # + cờ force_deflect
  mai_self_error: {nguong: 6, bon_chon: 5}
  chat_neutral: {}                                            # fallback default

  # ── Nhóm 3: Timer (4) ──
  silence_1min: {bon_chon: 4}
  silence_5min: {bon_chon: 6, buon: 4}
  silence_10min_plus: {bon_chon: 8, buon: 6}
  long_session_active: {vui: 6}

modifiers:
  # mod_repeated_shutdown: ≥N shutdown trong window ngày → nhân đích
  repeated_shutdown_window_days: 7
  repeated_shutdown_threshold: 3
  repeated_shutdown_multiplier: 1.3

  # mod_repeated_troll: mỗi lần thứ N trong session → cộng +bonus vào buc
  repeated_troll_bonus_per_hit: 0.5

  # mod_first_time: category lần đầu trong lịch sử → nhân đích
  first_time_multiplier: 1.2

  # A4 grudge: "trí nhớ xã hội" ngắn hạn theo viewer. Người vừa tiêu cực →
  # lượt sau với người ĐÓ hơi gắt hơn (buc). CAP + DECAY bắt buộc (chống toxic).
  grudge_window_seconds: 900        # 15' — quá ngưỡng thì grudge tự hết
  grudge_bonus_per_level: 0.5       # mỗi lần tiêu cực dồn +0.5 buc lượt sau
  grudge_max_bonus: 1.5             # CAP — KHÔNG leo thang thành harass
  grudge_max_level: 3               # cap số level tích (3 × 0.5 = 1.5)

# A4: category → intent NGẮN, CANONICAL (KHÔNG lưu nguyên văn chat) để prompt
# nói "bực VÌ {ai} {intent}" thay vì đọc số. Category không có = không cause.
cause_intents:
  chat_insult_troll: "buông lời khịa tớ"
  chat_jailbreak_attempt: "cố lừa tớ phá vai"
  chat_sexual_advance: "gạ gẫm linh tinh"
  chat_spam_flood: "spam ngập chat"
  chat_compliment: "vừa khen tớ"
  chat_mention_direct: "gọi tên tớ"
  chat_genuine_sad_share: "kể chuyện buồn thật"
  donation_small: "vừa ủng hộ tớ"
  donation_large: "vừa donate to cho tớ"
  subscribe_new: "vừa sub kênh"
  operator_join: "ông vừa vào"
  operator_leave: "ông vừa rời đi"
  operator_sudden_shutdown: "ông tắt tớ đột ngột"

# Cờ tone gắn category → thread qua Prompt + Filter (spec Mục 6.2)
tone_flags:
  chat_genuine_sad_share: force_gentle_tone
  chat_sexual_advance: force_deflect
  chat_jailbreak_attempt: force_deflect      # A4: high-toxicity → né, không chơi theo

# Ngưỡng phân loại donation size (VND). Điều chỉnh theo thị trường.
donation_thresholds:
  large_vnd: 50000
