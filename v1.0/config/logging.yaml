# logging.yaml — structlog + JSONL sink (ARCHITECTURE 9.3, 13.8)

level: INFO                      # DEBUG | INFO | WARNING | ERROR

console:
  enabled: true
  colors: true

jsonl:
  enabled: true
  dir: "logs"
  turns_file: "turns.jsonl"       # 1 dòng / turn hội thoại (schema ARCHITECTURE 9.3)
  delivery_outcomes_file: "delivery_outcomes.jsonl"  # outcome sau delivery gate
  events_file: "events.jsonl"     # log hệ thống chung

fail_safe:
  buffer_records: 256              # bounded in-memory records while disk sink is degraded

rotation:
  enabled: true
  max_size_mb: 100
  keep_files: 5
