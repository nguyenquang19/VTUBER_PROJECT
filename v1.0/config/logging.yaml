# logging.yaml — structlog + JSONL sink (ARCHITECTURE 9.3, 13.8)

level: INFO                      # DEBUG | INFO | WARNING | ERROR

console:
  enabled: true
  colors: true

jsonl:
  enabled: true
  dir: "logs"
  turns_file: "turns.jsonl"       # 1 dòng / turn hội thoại (schema ARCHITECTURE 9.3)
  events_file: "events.jsonl"     # log hệ thống chung

rotation:
  enabled: true
  max_size_mb: 100
  keep_files: 5
