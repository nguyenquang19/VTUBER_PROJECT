# system.yaml — cấu hình hệ thống chung (ARCHITECTURE 10.2)

app:
  name: mai
  version: "1.0.0"

dashboard:
  host: "127.0.0.1"
  port: 7860
  ws_path: "/ws"
  push_interval_s: 1.0

paths:
  data_dir: "data"
  log_dir: "logs"
  backup_dir: "backups"
  cache_dir: "cache"
  db_file: "data/mai.db"

conversation:
  cooldown_ms: 500
  max_state_duration:
    THINKING: 10000
    SPEAKING: 30000
    COOLDOWN: 5000

ambient_talk:
  enabled: true
  min_silence_seconds: 60      # v2.1: 1 threshold cứng, KHÔNG probability (ARCHITECTURE 7.9.2)
  content_variety_window: 10   # tránh lặp lại 10 câu gần nhất

emergency_stop:
  hotkey: "ctrl+shift+x"       # cần chạy Python với quyền Administrator (Windows)
  enabled: true

config_reload:
  enabled: true
  debounce_ms: 500             # gộp nhiều file-change event liên tiếp

event_bus:
  # Queue mỗi subscriber. VTuber realtime: thà drop event cũ còn hơn block
  # producer (chat flood không được làm nghẽn LLM/TTS).
  max_queue_size: 500
  overflow_policy: drop_oldest   # drop_oldest | drop_newest

resources:
  # RTX 5060 Ti 16GB. Baseline đã chiếm: Gemma 12B Q4_K_M ~8000MB (Pre-flight Day 1)
  # + viXTTS 1790MB (Day 2) = ~9790MB. Budget cho toggleable feature là phần còn lại,
  # trừ 1000MB buffer cho OS/driver/fragmentation.
  vram_total_mb: 16384
  vram_reserved_mb: 9790       # core: LLM + TTS
  vram_buffer_mb: 1000
  # → budget khả dụng cho feature toggle = 16384 - 9790 - 1000 = 5594 MB

features:
  # Feature core, KHÔNG toggle được (ARCHITECTURE 4.3)
  core:
    - input_chat
    - llm_main
    - parser_output
    - context_builder
    - memory_working
    - trigger_manager
    - state_machine
