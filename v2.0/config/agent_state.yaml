# Grounded working-state limits (Master Plan M1). No LLM calls are used here.
agent_state:
  recent_events_max: 64
  recent_event_ttl_s: 1800
  open_threads_max: 8
  open_thread_ttl_s: 900
  payload_text_max_chars: 320
  dedup_ttl_s: 1800

# Phase 2: bounded shadow state only; not a Director or prompt input.
world_model:
  allowed_domains: [stream, social, call, media, physical, game]
  default_ttl_s: 300
  source_authority:
    operator: 100
    environment: 80
    runtime: 60
  max_state_entries: 64
  max_evidence_refs: 8
  max_payload_items: 32
  max_payload_chars: 2048
  dedup_ttl_s: 1800
  max_dedup_keys: 128

# Phase 10: bounds for the canonical observation ingress; raw text never writes World state.
perception:
  max_payload_items: 16
  max_payload_chars: 1024
  max_recent_events: 128
  max_event_age_s: 300
  max_future_skew_s: 5
  dedup_ttl_s: 1800
  max_dedup_keys: 256
  chat:
    producer: chat_perception_adapter
    sources: [chat_twitch, chat_youtube, chat_discord]
  system:
    producer: system_perception_adapter
    input_sources: [system_timer, dashboard]
    grounded_routes:
      - producer: stream_runtime
        event_source: runtime
        canonical_source: runtime
        world_path: stream.runtime
        payload_mode: snapshot
  obs:
    producer: obs_perception_adapter
    source: environment
    world_path: stream.current_scene
    poll_interval_s: 2
    query_timeout_s: 2

# Phase 3: only bounds the immutable read-only projection.
self_model:
  max_recent_action_ids: 8
