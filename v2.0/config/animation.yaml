# animation.yaml — VTube Studio animation adapter (interfaces/animation.py).
#
# Gate qua feature `animation_smooth` (config/features.yaml). Mood → hotkey:
# đọc MoodState.dominant() sau DELIVERED rồi trigger hotkey tương ứng.
# Config-over-code: mọi thứ tune ở đây, không hardcode trong service.

animation:
  # Kết nối VTS API (Settings → Start API). Default port 8001.
  host: "localhost"
  port: 8001
  plugin_name: "Mai"
  plugin_developer: "Duc"
  # Credential local do VTS cấp; adapter đọc strict/ghi atomic. File mặc định bị Git ignore.
  token_file: "vts_token.txt"

  # Chỉ trigger lại khi chiều mood trội ĐỔI (chống spam 1 hotkey mỗi lượt).
  retrigger_on_same_mood: false

  # dominant (interfaces/animation.py::MoodState) → tên hotkey trong model.
  # SỬA tên phải cho khớp hotkey model của bạn. Thiếu chiều = không trigger.
  mood_hotkeys:
    vui: "My Animation 1"
    buon: "My Animation 2"
    buc: "My Animation 3"
    bon_chon: "My Animation 1"
    nguong: "My Animation 2"

  # Intentional actions only. Empty by default: no Director action can trigger VTS
  # until an operator explicitly allowlists a gesture ID and matching VTS hotkey.
  intentional_gesture_hotkeys: {}
  # All policy bounds; feature embodiment_policy remains off by default.
  embodiment:
    mid_cooldown_s: 2.0
    mid_timeout_s: 1.0
    intentional_cooldown_s: 3.0
    intentional_lease_ttl_s: 120.0
    max_evidence_refs: 4
    max_recent_records: 32
    max_id_chars: 160
    max_gesture_id_chars: 64
