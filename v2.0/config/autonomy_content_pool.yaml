# A2: bảng chuyển SỐ → LỜI TỰ NHIÊN (cấm đọc số thô, N6 config).
# material_provider map value → phrase theo band (max là ngưỡng trên, inclusive).
slot_language:
  silence_bands:            # silence_seconds → cách nói "im lặng bao lâu"
    - {max: 25, phrase: "vừa mới lặng đi một chút"}
    - {max: 75, phrase: "im được một lúc rồi"}
    - {max: 999999, phrase: "im lặng hơi lâu rồi đấy"}
  chat_activity_bands:     # chat_count_last_10min → không khí chat
    - {max: 0, phrase: "chat đang vắng tanh"}
    - {max: 8, phrase: "chat chỉ lác đác vài người"}
    - {max: 30, phrase: "chat đang rôm rả"}
    - {max: 999999, phrase: "chat đang trôi nhanh không đọc kịp"}
  ignored_bands:           # consecutive_ignored → gọi ông mấy lần chưa reply
    - {max: 0, phrase: "vừa mới lên tiếng"}
    - {max: 2, phrase: "đã gọi mấy lần mà chưa thấy ông đâu"}
    - {max: 999999, phrase: "gọi hoài mà ông lơ luôn"}

pool_policy:
  no_repeat_last_n: 20          # A2: 8 → 20. 1 seed dùng rồi thì 20 lần tự nói tiếp không lặp
  reshuffle_when_exhausted: true

# Post-generation duplicate bounds.
dedup:
  window: 5                      # so với 5 câu tự nói gần nhất
  token_overlap_threshold: 0.6   # Jaccard > 0.6 = coi là lặp

# Opening-phrase anti-repeat bounds.
opener_tracker:
  window: 5                      # nhớ 5 câu mở gần nhất
  words_per_opener: 3            # 3 từ đầu mỗi câu
