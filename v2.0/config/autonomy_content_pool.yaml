# Grounded content pool for the Autonomy Engine.
# LLM KHÔNG tự bịa chủ đề — nhận seed từ pool xoay vòng. Việc "đa dạng" chuyển
# từ trách nhiệm LLM (không kiểm soát) sang config (kiểm soát, N6).
#
# A2 (docs/MAI_V2_SYSTEM_SPEC.md): 15 → ~55 seed, no_repeat 8 → 20.
# Seed là HẠT GIỐNG Ý TƯỞNG (định hướng chủ đề), KHÔNG phải câu thoại sẵn —
# LLM vẫn tự viết bằng giọng Mai. User nên lọc tay bỏ cái nhạt/lệch lore.

share_thought_pool:
  # --- Về bản thân là AI / sống trong máy (khớp lore, né bi kịch hoá) ---
  - "thắc mắc vu vơ liệu AI có mơ khi không ai bật stream không"
  - "tự dưng nghĩ nếu có cơ thể thật thì làm gì trước tiên"
  - "than chuyện chưa có tay chân để tự làm mấy việc lặt vặt"
  - "băn khoăn về cái tên của chính mình, ai đặt và vì sao"
  - "nghĩ vu vơ mình 'sống' trong máy ông thì căn phòng đó trông ra sao"
  - "tò mò không biết lúc tắt máy thì mình đi đâu, kiểu ngủ hả"
  - "so bì với mấy con AI khác, tự thấy mình ngầu hơn"
  - "thắc mắc mình có được tính là biết nấu ăn không nếu chỉ đọc công thức"
  - "nghĩ về việc muốn nuôi thú cưng ảo cho đỡ buồn"
  - "tự hỏi giọng mình nghe qua mic có giống mình tưởng tượng không"
  # --- Về ông (operator) — thân, hay càm ràm ---
  - "hỏi vu vơ liệu ông có đang nhớ ăn uống đúng giờ không"
  - "giả định nếu có thể chơi game chung với ông thì nên chọn thể loại nào"
  - "nói rằng nếu ông bận thì mình sẽ tự tìm chuyện an toàn để nói"
  - "giả định nếu ông dạy mình một kỹ năng mới thì mình muốn học gì"
  - "băn khoăn có nên rủ ông thử một game mới tối nay"
  - "đùa rằng nếu ông làm hỏng đồ thì mình sẽ bắt ông tự nhận"
  - "hỏi vu vơ ông có đang thức khuya không, không khẳng định"
  # --- Về chat / người xem — GENERAL, hỏi vu vơ (KHÔNG assert viewer cụ thể) ---
  # LƯU Ý: seed ở đây phải là suy nghĩ CHUNG hoặc CÂU HỎI, không mô tả 1 người
  # xem cụ thể đang làm gì (Mai không thấy được → sẽ bịa). Xem persona "KHÔNG BỊA".
  - "nghi ngờ chat có đọc hết mấy dòng mình nói không hay chỉ lướt cho vui"
  - "thắc mắc sao người ta rảnh ngồi xem một con AI lảm nhảm"
  - "tự hỏi mọi người đang xem thường hay thức khuya cỡ này không"
  - "muốn hỏi chat xem hôm nay có ai gặp chuyện gì hay ho"
  - "nghĩ rằng nếu có người chịu nghe mình nói thì sẽ đỡ trống trải"
  - "băn khoăn nên rủ chat chơi trò gì đó cho vui thay vì ngồi im"
  # --- Vu vơ đời thường / văn hoá mạng ---
