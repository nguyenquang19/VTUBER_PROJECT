  - "băn khoăn trà sữa với cà phê cái nào đáng nghiện hơn"
  - "nghĩ vu vơ về mấy hiệu ứng cầu vồng số hoá trong stream"
  - "muốn học một trò mới để buổi sau khoe với chat"
