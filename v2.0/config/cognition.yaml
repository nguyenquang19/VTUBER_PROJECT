# MCB-2 read-only Context/Focus shadow. No Brain or runtime consumer is composed.
schema_version: 1
rollout_mode: disabled

max_id_chars: 128
max_label_chars: 64
max_text_chars: 2048
max_speech_chars: 512
max_attention_items: 24
max_memory_items: 16
max_recent_delivered_speech: 8
max_available_actions: 16
max_evidence_refs: 16
max_reason_codes: 8
max_memory_proposals: 4
max_unresolved_items: 8
max_focus_claims: 16
max_action_argument_items: 16
max_action_argument_chars: 1024
focus_ttl_seconds: 900
max_context_serialized_chars: 32768
max_context_snapshots: 128
max_context_request_age_seconds: 30
max_context_future_skew_seconds: 5
max_recent_speech_age_seconds: 1800
memory_query_top_k: 16
focus_saturation_move_count: 4
focus_pressure_by_status:
  active: 1.0
  waiting: 0.75
  parked: 0.25

source_failure_codes:
  - context
  - world
  - self
  - capability
  - transaction
  - emergency
  - operator
  - chat
  - goal
  - thread
  - proactive
  - memory
  - delivery

reason_codes:
  - no_opportunity
  - hard_hold
  - compatibility_only
  - insufficient_evidence
  - intentional_wait
  - propose_speech
  - propose_action
  - focus_continuity

speech_source_modes:
  - read_chat
  - self_talk
  - follow_up
