# Canonical Cognition configuration. Public rollout belongs to kernel.yaml.
schema_version: 1

brain_prompt_path: ".\\config\\prompts\\cognitive_brain_shadow_system.txt"
brain_max_output_tokens: 256
brain_temperature: 0.75
brain_timeout_seconds: 10.0
brain_cancel_grace_seconds: 0.25
max_brain_opportunity_queue: 1
max_brain_inflight: 1
max_brain_shadow_records: 128
opportunity_debounce_seconds: 1.5
opportunity_reconsider_seconds: 15.0
max_opportunity_age_seconds: 12.0
max_brain_intent_chars: 80
max_brain_speech_chars: 240
grounding_uncertainty_threshold: MEDIUM
grounding_evidence_policy: all_current

max_id_chars: 128
max_label_chars: 64
max_text_chars: 2048
max_speech_chars: 512
max_attention_items: 24
max_memory_items: 16
max_recent_delivered_speech: 8
max_available_actions: 16
max_evidence_refs: 16
max_reason_codes: 8
max_memory_proposals: 4
max_unresolved_items: 8
max_focus_claims: 16
max_action_argument_items: 16
max_action_argument_chars: 1024
focus_ttl_seconds: 900
max_context_serialized_chars: 32768
max_context_snapshots: 128
max_context_request_age_seconds: 30
max_context_future_skew_seconds: 5
max_recent_speech_age_seconds: 1800
memory_query_top_k: 16
focus_saturation_move_count: 4
focus_pressure_by_status:
  active: 1.0
  waiting: 0.75
  parked: 0.25

# S3 canonical owner for exact public compatibility projections.
agent_context_projection:
  min_items: 3
  max_items: 6
  item_max_chars: 220
  relevance_window_s: 900

conversation_context_projection:
  max_chars: 1400
  evidence_items: 3
  item_max_chars: 220

context_selector_projection:
  max_chars: 1800
  memory_items: 3
  world_items: 4
  capability_items: 3

source_failure_codes:
  - context
  - world
  - self
  - capability
  - transaction
  - emergency
  - operator
  - chat
  - goal
  - thread
  - proactive
  - memory
  - delivery

reason_codes:
  - no_opportunity
  - hard_hold
  - compatibility_only
  - insufficient_evidence
  - intentional_wait
  - propose_speech
  - propose_action
  - focus_continuity

speech_source_modes:
  - read_chat
  - self_talk
  - follow_up
