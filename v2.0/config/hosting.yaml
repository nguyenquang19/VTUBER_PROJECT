# M5 mood-aware agency, proactive hosting, behavior, timing, and evaluation policy.
mood_policy:
  enabled: true
  activation_floor: 6
  priority_min: 0
  priority_max: 100
  proactive_score_floor: 50
  agenda_deltas:
    vui:
      answer_follow_up: 8
      continue_thread: 6
    buon:
      wait_for_chat_answer: -8
      continue_thread: -5
    buc:
      answer_follow_up: 6
      continue_thread: -4
    bon_chon:
      wait_for_chat_answer: 8
      continue_thread: 10
    nguong:
      answer_follow_up: -6
  director_scores:
    vui: {read_chat: 8, self_talk: 8, follow_up: 10}
    buon: {read_chat: -5, self_talk: -12, follow_up: -5}
    buc: {read_chat: 8, self_talk: -6, follow_up: 4}
    bon_chon: {read_chat: 5, self_talk: 25, follow_up: 20}
    nguong: {read_chat: -5, self_talk: -8, follow_up: -4}
  tone_flag_deltas:
    force_gentle_tone:
      agenda: {answer_follow_up: 15, continue_thread: 8}
      director: {read_chat: 15, self_talk: -30, follow_up: 10}
    force_deflect:
      agenda: {answer_follow_up: 12}
      director: {read_chat: 18, self_talk: -30, follow_up: -10}

proactive_policy:
  enabled: true
  source_cooldown_seconds: 90
  open_thread_category: follow_up_topic
  environment_category: environment_reaction
  silence_category: complain_silence
  environment_summary_max_chars: 220

behavior_library:
  enabled: true
  directive_max_chars: 240
  tease_mood_floor: 7
  safety_overrides:
    force_gentle_tone: acknowledge
    force_deflect: deflect
  action_defaults:
    read_chat: curious
    ack_donation: acknowledge
    self_talk: invite
    follow_up: curious
    continue_thread: curious
    ask_follow_up: invite
    share_goal_progress: acknowledge
    transition: transition
  behaviors:
    curious:
      directive: "React only to literal grounded content. Keep hypotheticals conditional; for vague, emoji-only, or unknown terms state uncertainty or ask at most one clarifying question. Never invent viewer intent, visual state, past experience, mechanics, or external facts."
      applicability: {actions: [read_chat, follow_up, continue_thread]}
      safety_guard: {forbidden_flags: []}
    deflect:
      directive: "Deflect the unsafe or sexual direction briefly; do not flirt back or continue it."
      applicability: {actions: ["*"]}
      safety_guard: {forbidden_flags: []}
    tease:
      directive: "Tease only the exact literal grounded message; an emoji is only an emoji, not evidence of intent or mental state. Never target pain, vulnerability, or protected traits."
      applicability: {actions: [read_chat]}
      safety_guard: {forbidden_flags: [force_gentle_tone, force_deflect]}
    acknowledge:
      directive: "Acknowledge only the grounded person or situation before adding anything else; do not roast; keep hypotheticals conditional and do not invent missing context."
      applicability: {actions: ["*"]}
      safety_guard: {forbidden_flags: []}
    repair:
      directive: "Repair explicitly: state uncertainty or ask one clarifying question; do not guess meaning, identity, intent, visuals, mechanics, history, or external state."
      applicability: {actions: ["*"]}
      safety_guard: {forbidden_flags: []}
    invite:
      directive: "Invite chat to respond with one concrete, easy question; do not pressure anyone."
      applicability: {actions: [self_talk, ask_follow_up]}
      safety_guard: {forbidden_flags: [force_deflect]}
    transition:
      directive: "Bridge naturally from the grounded current topic to the named next segment in one sentence."
      applicability: {actions: [transition]}
      safety_guard: {forbidden_flags: []}
