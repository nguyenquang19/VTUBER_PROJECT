# B3 canary-ready owner routing. Public Brain still requires its feature flag.
schema_version: 1
rollout_mode: brain
tick_seconds: 1.5
max_recent_selections: 256
max_reason_codes: 8
max_id_chars: 128
reason_codes:
  - emergency
  - operator_hold
  - safety_hold
  - permission_hold
  - transaction_conflict
  - critical_state
  - source_failure
brain_canary_roles:
  - owner
  - moderator
