# M9 — bounded live recovery and operator control.
health_supervisor:
  enabled: true
  recovery_mode: "bounded_auto_restart"  # bounded_auto_restart | alert_only
  interval_s: 10.0
  check_timeout_s: 5.0
  restart_timeout_s: 30.0
  unhealthy_threshold: 2
  max_restart_attempts: 3
  restart_window_s: 300.0
  backoff_initial_s: 2.0
  backoff_max_s: 30.0
  manage_llama_process: true

live_preflight:
  max_age_s: 300.0
  max_future_skew_s: 30.0

turn_journal:
  max_lineages: 512
  max_events_per_lineage: 32
  max_reason_codes: 8
  max_evidence_refs: 16
  max_label_chars: 160
  max_projection_bytes: 65536

surface:
  max_snapshot_sections: 64
  max_commands: 32
  max_label_chars: 120
  max_payload_bytes: 16384

shutdown:
  timeout_s: 15.0
  snapshot_file: "logs/operations/last_runtime_snapshot.json"

dashboard_standalone:
  open_browser: true
  browser_delay_s: 0.8
  operator_audit_file: "logs/operations/operator_audit.jsonl"
  host: "127.0.0.1"
  port: 7861
  live_base_url: "http://127.0.0.1:7860"
  request_timeout_s: 0.75
  history:
    max_files: 6
    max_records: 5000
    default_limit: 100
    max_limit: 500

incident_log:
  file: "logs/operations/incidents.jsonl"
  recent_limit: 100
  text_max_chars: 320

post_stream_review:
  export_dir: "logs/operations/reviews"

emergency_stop:
  cancel_goal_on_resume_if_expired: true
  reason_max_chars: 240
