# M9 — bounded live recovery and operator control.
health_supervisor:
  enabled: true
  recovery_mode: "bounded_auto_restart"  # bounded_auto_restart | alert_only
  interval_s: 10.0
  check_timeout_s: 5.0
  restart_timeout_s: 30.0
  unhealthy_threshold: 2
  max_restart_attempts: 3
  restart_window_s: 300.0
  backoff_initial_s: 2.0
  backoff_max_s: 30.0
  manage_llama_process: true

live_preflight:
  max_age_s: 300.0
  max_future_skew_s: 30.0

release_readiness:
  schema_version: 2
  target_version: "2.0.0"
  artifact_max_age_s: 86400.0
  max_future_skew_s: 30.0
  max_artifacts: 16
  max_label_chars: 160
  required_test_groups: [targeted, offline, llm, slow, smoke]
  required_preflight_checks:
    - windows
    - python
    - credential_contract
    - llama_binary
    - llm_model
    - tts_reference
    - transactions
    - decision_records
    - subtitle_fallback
    - subtitle_path
    - platform
    - llama_health
  correctness_zero_counters:
    - unauthorized_executed_actions
    - unavailable_capability_executed
    - duplicate_committed_actions
    - false_committed_world_states
    - transaction_inconsistencies
  human_quality:
    min_pairs: 20
    minimum_previous_build_delta: 0.0001
    max_ai_smell_rate_increase: 0.0
    minimum_character_delta: 0.0

closed_loop_canary:
  schema_version: 1
  allowed_actions: [SWITCH_SCENE]
  execution_timeout_s: 15.0
  max_recent: 16
  max_label_chars: 160

shutdown:
  timeout_s: 15.0
  snapshot_file: "logs/operations/last_runtime_snapshot.json"

dashboard_standalone:
  open_browser: true
  browser_delay_s: 0.8
  operator_audit_file: "logs/operations/operator_audit.jsonl"
  host: "127.0.0.1"
  port: 7861
  live_base_url: "http://127.0.0.1:7860"
  request_timeout_s: 0.75
  history:
    max_files: 6
    max_records: 5000
    default_limit: 100
    max_limit: 500

incident_log:
  file: "logs/operations/incidents.jsonl"
  recent_limit: 100
  text_max_chars: 320

post_stream_review:
  export_dir: "logs/operations/reviews"

emergency_stop:
  cancel_goal_on_resume_if_expired: true
  reason_max_chars: 240

soak:
  duration_s: 7200
  sample_interval_s: 5.0
  input_rate_hz: 20.0
  queue_capacity: 256
  progress_timeout_s: 30.0
  latency_sample_max: 20000
  max_memory_growth_mb: 128.0
  max_queue_growth: 20
  max_error_rate: 0.01
  latency_p95_budget_ms: 1500.0
  report_file: "docs/baselines/m9_live_operations.json"
