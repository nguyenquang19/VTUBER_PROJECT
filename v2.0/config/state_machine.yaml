# Five-state, nine-transition conversation state machine.
#
# N1 YAGNI: đúng 5 state, 9 transition. KHÔNG thêm LISTENING / INTERRUPTED /
# ERROR — xem 7.10.1 để biết khi nào mới tách.

state_machine:
  initial_state: IDLE

  cooldown_ms: 500

  # TriggerManager enforces this policy while speech is active.
  interrupt_policy:
    operator_text:
      allow_after_ms: 2000       # sau 2s speaking mới cho interrupt
    chat_mention:
      allow_after_ms: 999999     # không interrupt speech vì chat
    chat_normal:
      allow_after_ms: 999999

  # Deadlock watchdog bounds; kept aligned with conversation duration limits.
  auto_recovery:
    stuck_state_check_interval_seconds: 1
    max_time_in_state_seconds:
      IDLE: null                 # OK ở IDLE lâu
      THINKING: 10
      SPEAKING: 30
      COOLDOWN: 5
      PAUSED: null               # PAUSED là chủ ý, không phải deadlock
