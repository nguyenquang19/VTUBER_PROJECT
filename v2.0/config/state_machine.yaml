# state_machine.yaml — 5 state / 9 transition (ARCHITECTURE 10.5, 7.10)
#
# N1 YAGNI: đúng 5 state, 9 transition. KHÔNG thêm LISTENING / INTERRUPTED /
# ERROR — xem 7.10.1 để biết khi nào mới tách.

state_machine:
  initial_state: IDLE

  cooldown_ms: 500

  # Interrupt policy — Phase 2 mới dùng (7.9.3). Để sẵn value ở đây để Phase 2
  # không phải sửa 2 chỗ; Phase 0 chỉ đọc, chưa enforce.
  interrupt_policy:
    operator_text:
      allow_after_ms: 2000       # sau 2s speaking mới cho interrupt
    chat_mention:
      allow_after_ms: 999999     # không interrupt speech vì chat
    chat_normal:
      allow_after_ms: 999999

  # Deadlock watchdog — Phase 2 mới implement (7.10.4). Threshold khớp
  # system.yaml conversation.max_state_duration.
  auto_recovery:
    stuck_state_check_interval_seconds: 1
    max_time_in_state_seconds:
      IDLE: null                 # OK ở IDLE lâu
      THINKING: 10
      SPEAKING: 30
      COOLDOWN: 5
      PAUSED: null               # PAUSED là chủ ý, không phải deadlock
