# Shared application and runtime-bound configuration.

app:
  name: mai
  version: "1.4.3"

dashboard:
  host: "127.0.0.1"
  port: 7860
  control_token_env: "MAI_DASHBOARD_CONTROL_TOKEN"
  ws_path: "/ws"
  push_interval_s: 1.0
  gpu_metrics:
    command: "nvidia-smi"
    timeout_s: 1.0
    refresh_s: 2.0

paths:
  data_dir: "data"
  log_dir: "logs"
  backup_dir: "backups"
  cache_dir: "cache"
  db_file: "data/mai.db"

memory:
  working_maxlen: 20
  query_timeout_s: 0.15
  default_top_k: 3
  max_query_top_k: 20
  content_max_chars: 4000
  metadata_max_items: 24
  metadata_text_max_chars: 512
  tags_max: 12
  tag_max_chars: 64
  extractor_min_chars: 15
  extractor_promote_intensity: 7
  pending_writes_max: 64

conversation:
  cooldown_ms: 500
  max_state_duration:
    THINKING: 10000
    SPEAKING: 30000
    COOLDOWN: 5000
  # CONTINUATION đơn giản: nếu Mai kết "còn nữa: có" → tự chạy tiếp N lượt nữa.
  # 0 = tắt (giữ hành vi phase 1-4). 2 = an toàn cho MVP (không kéo lê quá dài).
  # Full CONTINUATION trigger (thứ 5) đã YAGNI-out ở phase 2 — đây chỉ là hook CLI.
  auto_continue_max: 2

emergency_stop:
  hotkey: "ctrl+shift+x"       # cần chạy Python với quyền Administrator (Windows)
  enabled: true

config_reload:
  enabled: true
  debounce_ms: 500             # gộp nhiều file-change event liên tiếp

smoke:
  request_timeout_s: 5.0       # timeout cho dashboard ASGI smoke (không bind port)
  shutdown_timeout_s: 5.0      # graceful shutdown phải hoàn tất trong giới hạn này

resources:
  # RTX 5060 Ti 16GB. Baseline đã chiếm: Gemma 12B Q4_K_M ~8000MB (Pre-flight Day 1)
  # + VieNeu-TTS v3 Turbo 400MB (local measured baseline) = ~8400MB. Budget cho toggleable
  # feature là phần còn lại, trừ 1000MB buffer cho OS/driver/fragmentation.
  # (Trước swap 2026-08: viXTTS chiếm 1790MB → budget hẹp hơn 1390MB.)
  vram_total_mb: 16384
  vram_reserved_mb: 8400       # core: LLM + TTS
  vram_buffer_mb: 1000
  # → budget khả dụng cho feature toggle = 16384 - 8400 - 1000 = 6984 MB

features:
  # Core features cannot be toggled at runtime.
  core:
    - input_chat
    - llm_main
    - parser_output
    - context_builder
    - memory_working
