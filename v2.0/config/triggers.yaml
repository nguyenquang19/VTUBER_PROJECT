# Four bounded trigger types used by the current runtime.
#
# N1 YAGNI: đúng 4 type. KHÔNG thêm donation/subscribe/question/keyword/
# continuation/scheduled/operator_voice_interrupt — add khi log thực tế cần.
# priority khớp đúng code mẫu 7.9.1.
#
# Voice input is deferred by the current scope. `operator_voice` keeps its type
# and priority but currently comes from operator text on the dashboard
# (`EventSource.DASHBOARD`), not from a microphone.

triggers:
  priorities:
    operator_voice: 100
    chat_mention: 60
    chat_normal: 30
    ambient_talk: 10

  # Rate limit CHỈ áp cho chat_normal (operator/mention luôn qua — 7.9.2)
  rate_limits:
    chat_normal:
      window_seconds: 10
      max_responses: 3

  queue:
    max_size: 30
    default_ttl_seconds: 30
    drop_policy: lowest_priority

  # Keyword để nhận mention (classify CHAT_MENTION)
  chat_keywords:
    - mai
    - "mèo"
    - "ông"

  # Ambient talk: 1 threshold cứng, KHÔNG probability (7.9.2 / N1)
  ambient:
    enabled: true
    min_silence_seconds: 60

  spam:
    min_length: 2
    max_emoji_ratio: 0.7
    max_repeat_chars: 5
    blocked_patterns:
      - "^k+$"        # kkkkk
      - "^h+a+$"      # hahaha
