# triggers.yaml — 4 trigger type (ARCHITECTURE 10.4, 7.9.1)
#
# N1 YAGNI: đúng 4 type. KHÔNG thêm donation/subscribe/question/keyword/
# continuation/scheduled/operator_voice_interrupt — add khi log thực tế cần.
# priority khớp đúng code mẫu 7.9.1.
#
# MVP scope (docs/MAI_V2_SYSTEM_SPEC.md): voice input skip. `operator_voice` giữ
# nguyên type + priority, nhưng nguồn là operator TEXT từ dashboard
# (EventSource.DASHBOARD), không phải voice. Wire STT sau ở Phase 5.

triggers:
  priorities:
    operator_voice: 100
    chat_mention: 60
    chat_normal: 30
    ambient_talk: 10

  # Rate limit CHỈ áp cho chat_normal (operator/mention luôn qua — 7.9.2)
  rate_limits:
    chat_normal:
      window_seconds: 10
      max_responses: 3

  queue:
    max_size: 30
    default_ttl_seconds: 30
    drop_policy: lowest_priority

  # Keyword để nhận mention (classify CHAT_MENTION)
  chat_keywords:
    - mai
    - "mèo"
    - "ông"

  # Ambient talk: 1 threshold cứng, KHÔNG probability (7.9.2 / N1)
  ambient:
    enabled: true
    min_silence_seconds: 60

  spam:
    min_length: 2
    max_emoji_ratio: 0.7
    max_repeat_chars: 5
    blocked_patterns:
      - "^k+$"        # kkkkk
      - "^h+a+$"      # hahaha
