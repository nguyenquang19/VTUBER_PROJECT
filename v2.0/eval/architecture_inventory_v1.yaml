  - path: services/cognition/agent_context_projection.py
    disposition: MERGE
    target_owner: services/cognition/context_builder.py
    reason: Exact agent-only compatibility projection owned by the canonical builder.
  - path: services/agent/conversation_context.py
    disposition: DELETE
    target_owner: services/cognition/context_builder.py
    deletion_gate: post_s8_zero_repository_importer
    reason: Bounded selection behavior lives in cognition; the test-only import facade is retired.
  - path: services/agent/conversation_move_planner.py
    disposition: DELETE
    target_owner: services/cognition/brain.py
    deletion_gate: after_s6_continuity_canary
    reason: Conversation move is a Brain soft decision.
  - path: services/agent/behavior_library.py
    disposition: DELETE
    target_owner: services/cognition/brain.py
    deletion_gate: after_s6_content_blind_acceptance
    reason: Structured soft behavior directives must not remain a second personality writer.
  - path: services/agent/mood_policy.py
    disposition: DELETE
    target_owner: services/state/affect.py
    deletion_gate: after_s6_affect_context_parity
    reason: Keep affect state, remove parallel soft response policy.
  - path: services/autonomy/self_talk_planner.py
    disposition: DELETE
    target_owner: services/kernel/opportunity_scheduler.py
    deletion_gate: after_s6_self_talk_temporal_canary
    reason: Self-talk opportunity merges into the single scheduler.
  - path: services/autonomy/prompt_builder.py
    disposition: DELETE
    target_owner: services/cognition/prompt_builder.py
    deletion_gate: after_s6_self_talk_content_acceptance
    reason: One Brain prompt owner handles all conversation modes.
  - path: services/filter/regenerator.py
    disposition: DELETE
    target_owner: services/kernel/turn_validator.py
    deletion_gate: after_s4_hard_validator_acceptance
    reason: Target validator accepts/rejects and never rewrites style.
  - path: services/filter/rule_filter.py
    disposition: MERGE
    target_owner: services/kernel/turn_validator.py
    reason: Preserve only hard correctness/safety checks.
  - path: services/llm/canned_response.py
    disposition: DELETE
    target_owner: services/kernel/turn_kernel.py
    deletion_gate: after_s4_wait_failure_acceptance
    reason: Brain failure returns WAIT, not canned personality text.
  - path: services/evaluation/closed_loop_canary.py
    disposition: OFFLINE
    target_owner: services/evaluation
    reason: Operator evaluation tool must not be composed into live runtime.
  - path: services/evaluation/human_like.py
    disposition: OFFLINE
    target_owner: services/evaluation
    reason: Blind review is an offline quality workflow.
  - path: services/evaluation/release_gate.py
    disposition: OFFLINE
    target_owner: services/evaluation
    reason: Release inspection runs outside live composition.
  - path: services/action/mock_backend.py
    disposition: OFFLINE
    target_owner: services/evaluation
    reason: Mock execution belongs to tests/replay only.
  - path: services/action/mock_loop.py
    disposition: OFFLINE
    target_owner: services/evaluation
    reason: Mock closed loop is not a production runtime owner.
  - path: scripts/start_live.ps1
    disposition: KEEP
    target_owner: scripts/start_live.ps1
    reason: Canonical Windows live launcher.
  - path: scripts/stream_youtube.py
    disposition: MERGE
    target_owner: orchestrator/entrypoints/youtube.py
    reason: Thin launcher moves to the canonical entrypoint package.
  - path: scripts/stream_discord.py
    disposition: MERGE
    target_owner: orchestrator/entrypoints/discord.py
    reason: Thin launcher moves to the canonical entrypoint package.
  - path: eval/contracts/mai_agent_v1.yaml
    disposition: ARCHIVE
    target_owner: eval/contracts
    reason: Historical contract remains offline regression evidence.
  - path: eval/scenarios/mai_agent_v1.yaml
    disposition: ARCHIVE
    target_owner: eval/scenarios
    reason: Historical scenario remains offline regression evidence.

